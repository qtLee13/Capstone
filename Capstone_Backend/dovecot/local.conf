# Capstone Mail Server - Dovecot 2.4 override (วางที่ /etc/dovecot/local.conf)
# เสิร์ฟ IMAP (143/993) + POP3 (110/995) จาก Maildir ที่ mail_store.py เขียนไว้

protocols = imap pop3

# demo ภายในวง ZeroTier - อนุญาต login แบบ cleartext (ระบบจริงควรบังคับ TLS)
auth_allow_cleartext = yes

# mailbox ของแต่ละ user อยู่ที่ Mail_Server_DB/maildir/<user>/Maildir
mail_driver = maildir
mail_path = /home/capstone/Capstone/Capstone_Backend/Mail_Server_DB/maildir/%{user | username}/Maildir

# ทุก mailbox เป็นของ system user "capstone" (virtual users)
first_valid_uid = 1000

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb static {
  fields {
    uid = capstone
    gid = capstone
    home = /home/capstone/Capstone/Capstone_Backend/Mail_Server_DB/maildir/%{user | username}
  }
}
