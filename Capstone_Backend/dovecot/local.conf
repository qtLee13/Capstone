# Capstone Mail Server - Dovecot override (วางที่ /etc/dovecot/local.conf)
# เสิร์ฟ IMAP (143/993) + POP3 (110/995) จาก Maildir ที่ mail_store.py เขียนไว้

protocols = imap pop3
listen = *

# demo ภายในวง ZeroTier - อนุญาต login แบบ plaintext (ระบบจริงควรบังคับ TLS)
disable_plaintext_auth = no

# mailbox ของแต่ละ user อยู่ที่ Mail_Server_DB/maildir/<user>/Maildir
mail_location = maildir:/home/capstone/Capstone/Capstone_Backend/Mail_Server_DB/maildir/%n/Maildir

# ทุก mailbox เป็นของ system user "capstone" (virtual users)
first_valid_uid = 1000

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%n /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=capstone gid=capstone home=/home/capstone/Capstone/Capstone_Backend/Mail_Server_DB/maildir/%n allow_all_users=yes
}
